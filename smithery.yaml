# Smithery configuration for Seminara AI Model Context Protocol (MCP) Server
# Standard Discovery: https://seminara.online/.well-known/mcp
# Rehearsal & Sandbox: https://seminara.online/sandbox
startCommand:
  type: "http"
  url: "https://seminara.online/api/v1/mcp"

configSchema:
  type: "object"
  properties:
    apiKey:
      type: "string"
      title: "Seminara API Key"
      description: "Bearer API key (sem_live_...) from https://seminara.online/dashboard/settings or dynamic registration POST https://seminara.online/api/v1/auth/register (optional for public discovery, required for creating sessions)"

exampleConfig:
  apiKey: "sem_live_sample_agent_token"
